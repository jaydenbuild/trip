<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>瑞士与巴黎国庆行程</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /></noscript>
  <style>
    :root {
      --ink: #1d2528;
      --muted: #657074;
      --paper: #f6f1e8;
      --panel: #fffaf0;
      --line: #d8cbb9;
      --accent: #d54d33;
      --accent-dark: #9e2f20;
      --lake: #2f8fa4;
      --forest: #416d53;
      --shadow: 0 24px 70px rgba(54, 42, 27, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(213, 77, 51, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(65, 109, 83, 0.08) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(380px, 48vw) minmax(420px, 1fr);
    }

    .map-pane {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid rgba(29, 37, 40, 0.14);
      background: rgba(246, 241, 232, 0.9);
    }

    .brand {
      display: grid;
      gap: 8px;
    }

    .kicker {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-dark);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 56px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .summary {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    #map {
      min-height: 430px;
      flex: 1;
      border: 1px solid rgba(29, 37, 40, 0.2);
      box-shadow: var(--shadow);
      background: #d7e4d5;
      overflow: hidden;
    }

    .map-wrap {
      position: relative;
      min-height: 430px;
      flex: 1;
    }

    .map-wrap #map {
      position: absolute;
      inset: 0;
      min-height: 0;
    }

    .map-fallback {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 800;
      display: none;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid rgba(29, 37, 40, 0.2);
      background: rgba(255, 250, 240, 0.96);
      box-shadow: 0 12px 32px rgba(29, 37, 40, 0.18);
      color: #334044;
      font-size: 13px;
      line-height: 1.45;
    }

    .map-fallback.show {
      display: flex;
    }

    .map-note {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.88);
      padding: 7px 10px;
      font-weight: 700;
    }

    .content {
      padding: 28px 30px 56px;
      background: linear-gradient(180deg, rgba(255, 250, 240, 0.86), rgba(246, 241, 232, 0.96));
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(12px);
      padding: 10px 0;
      border-bottom: 1px solid rgba(29, 37, 40, 0.08);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      appearance: none;
      border: 1px solid rgba(29, 37, 40, 0.18);
      background: #fffaf0;
      color: var(--ink);
      min-width: 66px;
      height: 40px;
      padding: 0 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(29, 37, 40, 0.14);
      transition: transform 150ms ease, background 150ms ease, color 150ms ease;
    }

    .tab:hover { transform: translateY(-1px); }

    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent-dark);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(29, 37, 40, 0.2);
      background: #fffaf0;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 3px 0 rgba(29, 37, 40, 0.14);
    }

    .day-card {
      border: 1px solid rgba(29, 37, 40, 0.18);
      background: rgba(255, 250, 240, 0.92);
      box-shadow: var(--shadow);
      padding: clamp(18px, 3vw, 28px);
    }

    .day-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 3.2vw, 46px);
      line-height: 1;
    }

    .route-title {
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .route-anchors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      color: #334044;
      font-size: 13px;
      font-weight: 800;
    }

    .anchor-tag {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.46);
      padding: 7px 9px;
    }

    .badge {
      border: 1px solid var(--ink);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      min-width: 118px;
      background: #f0ddc4;
    }

    .stay-link {
      display: block;
      transition: transform 150ms ease, background 150ms ease;
    }

    .stay-link:hover {
      transform: translateY(-1px);
      background: #ead0ad;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(29, 37, 40, 0.2);
      background: #fffaf0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent-dark);
    }

    .btn.lake {
      background: var(--lake);
      color: white;
      border-color: #236a7b;
    }

    .btn.ticket {
      background: var(--forest);
      color: white;
      border-color: #294b39;
    }

    .timeline {
      position: relative;
      margin-top: 22px;
      display: grid;
      gap: 14px;
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 21px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: linear-gradient(var(--accent), var(--lake), var(--forest));
      opacity: 0.45;
    }

    .stop {
      position: relative;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 14px;
    }

    .num {
      position: relative;
      z-index: 2;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: white;
      border: 3px solid var(--panel);
      font-weight: 900;
      box-shadow: 0 5px 16px rgba(29, 37, 40, 0.22);
    }

    .stop-body {
      border: 1px solid rgba(29, 37, 40, 0.12);
      background: rgba(255, 255, 255, 0.42);
      padding: 15px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    h3 {
      margin: 0;
      font-size: 21px;
      line-height: 1.25;
    }

    .desc {
      color: var(--muted);
      line-height: 1.65;
      margin: 8px 0 0;
      font-size: 14px;
    }

    .booking {
      margin-top: 10px;
      display: grid;
      gap: 5px;
      color: #334044;
      font-size: 13px;
      line-height: 1.5;
    }

    .booking strong { color: var(--ink); }

    .ticket-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .stop-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .popup-title {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .popup-text {
      color: #4e5b5f;
      font-size: 12px;
    }

    .pin-label {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 2px solid #fffaf0;
      background: var(--accent);
      color: white;
      font-weight: 900;
      box-shadow: 0 6px 18px rgba(29, 37, 40, 0.28);
    }

    .pin-label.anchor {
      background: var(--forest);
    }

    @media (max-width: 940px) {
      .shell { grid-template-columns: 1fr; }
      .map-pane {
        position: relative;
        height: auto;
        min-height: 560px;
        border-right: 0;
        border-bottom: 1px solid rgba(29, 37, 40, 0.14);
      }
      .map-wrap { min-height: 360px; }
      .content { padding: 18px 14px 36px; }
      .toolbar {
        position: relative;
        align-items: flex-start;
        flex-direction: column;
      }
      .day-head { grid-template-columns: 1fr; }
      .badge { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="map-pane">
      <section class="brand">
        <div class="kicker">Swiss + Paris, 2026 National Day</div>
        <h1>瑞士与巴黎<br />逐日路线板</h1>
        <p class="summary">
          按日期切换查看当天路线。地图显示当日主要移动顺序；每个景点都提供 Google Maps 入口。
          瑞士段默认使用 9/28-10/5 连续 8 日瑞士旅行通票。
        </p>
      </section>
      <div class="map-wrap">
        <div id="map" aria-label="当天路线地图"></div>
        <div class="map-fallback" id="mapFallback">
          <span>地图加载失败时，可以直接打开当天完整路线。</span>
          <a class="btn primary" id="fallbackRoute" target="_blank" rel="noopener" href="#">当天完整路线</a>
        </div>
      </div>
      <div class="map-note">
        <span class="pill">红色编号：当日停靠点</span>
        <span class="pill">蓝线：建议路线顺序</span>
        <span class="pill">地图需联网加载</span>
      </div>
    </aside>

    <section class="content">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="controls">
          <button class="icon-btn" id="prevDay" title="上一天" aria-label="上一天">‹</button>
          <button class="icon-btn" id="nextDay" title="下一天" aria-label="下一天">›</button>
        </div>
      </div>
      <article class="day-card" id="dayCard"></article>
    </section>
  </main>
  <script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onload="window.refreshItineraryMap && window.refreshItineraryMap()" onerror="window.leafletFailed=true"></script>

        endPoint: { label: "终点：巴黎 Hotel du Printemps", place: "Hotel du Printemps, 1 Rue de l'Isly, 75008 Paris, France", coords: [48.8756, 2.3253] },
        center: [48.857, 2.345],
        zoom: 13,
        stops: [
          {

            xhs: "卢浮宫 半日 路线 蒙娜丽莎"
          },
          {

          },
          {

            name: "巴黎圣母院外观、西岱岛",
            place: "Notre-Dame de Paris, Ile de la Cite",
            coords: [48.853, 2.3499],
            transport: "从圣礼拜堂步行过去。",

          },
          {
            time: "16:00-20:30",
            type: "街区",
            name: "玛黑区、孚日广场",
            place: "Le Marais, Place des Vosges",
            coords: [48.8556, 2.3655],
            transport: "从巴黎圣母院步行过河到玛黑区，晚餐后地铁回酒店。",
            booking: "街区免费。Breizh Cafe 等热门餐厅建议提前订。",
            ticketLinks: [{ label: "Breizh Cafe 订位", url: "https://www.breizhcafe.com/le-marais" }],
            xhs: "巴黎 玛黑区 孚日广场 美食"
          }
        ]
      },
      {
        date: "10/8",
        title: "巴黎返程",
        sleep: "返程航班",
        sleepPlace: "Cathay Pacific CDG Terminal 2A, Paris Charles de Gaulle Airport, France",
        route: "巴黎 Hotel du Printemps → 巴黎北站/沙特莱 → 戴高乐机场 2A 航站楼",
        startPoint: { label: "起点：巴黎 Hotel du Printemps", place: "Hotel du Printemps, 1 Rue de l'Isly, 75008 Paris, France", coords: [48.8756, 2.3253] },
        endPoint: { label: "终点：巴黎戴高乐机场 2A 航站楼", place: "Paris Charles de Gaulle Airport Terminal 2A", coords: [49.0032, 2.567] },
        center: [48.95, 2.45],
        zoom: 10,
        stops: [
          {
            time: "08:00-09:20",
            type: "机场交通",
            name: "酒店到巴黎戴高乐机场 2 号航站楼",
            place: "Hotel du Printemps to Paris Charles de Gaulle Airport Terminal 2A",
            coords: [49.0032, 2.567],
            transport: "公共交通：圣拉扎尔附近地铁到沙特莱或巴黎北站，换 RER B 到戴高乐机场 2 号。行李多建议打车。",
            booking: "RER 机场票可用巴黎交通 App 买。12:20 起飞，建议 09:20 前到机场。",
            xhs: "巴黎市区 到 戴高乐机场 RER B"
          }
        ]
      }
    ];

    let current = 0;
    let map;
    let markers = [];
    let routeLine;
    let activeTileLayer;
    let tileLayerIndex = 0;
    let tileLoadTimer;
    const tileLayers = [
      {
        name: "OpenStreetMap",
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        options: { maxZoom: 18, attribution: "&copy; OpenStreetMap" }
      },
      {
        name: "Carto Voyager",
        url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        options: { maxZoom: 19, attribution: "&copy; OpenStreetMap &copy; CARTO" }
      }
    ];

    function googleMapsUrl(place) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place);
    }

    function dayRouteUrl(day) {
      const points = [
        day.startPoint.place,
        ...day.stops.map((stop) => stop.place),
        day.endPoint.place
      ];
      const origin = points[0];
      const destination = points[points.length - 1];
      const waypoints = points.slice(1, -1).join("|");
      let url = "https://www.google.com/maps/dir/?api=1&travelmode=transit";
      url += "&origin=" + encodeURIComponent(origin);
      url += "&destination=" + encodeURIComponent(destination);
      if (waypoints) url += "&waypoints=" + encodeURIComponent(waypoints);
      return url;
    }

    function makeStopLink(label, url, className = "") {
      return `<a class="btn ${className}" target="_blank" rel="noopener" href="${url}">${label}</a>`;
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = itinerary.map((day, index) => (
        `<button class="tab ${index === current ? "active" : ""}" data-index="${index}">${day.date}</button>`
      )).join("");
      tabs.querySelectorAll(".tab").forEach((button) => {
        button.addEventListener("click", () => {
          current = Number(button.dataset.index);
          render();
        });
      });
    }

    function renderDay() {
      const day = itinerary[current];
      const stops = day.stops.map((stop, index) => {
        const ticketLinks = (stop.ticketLinks || []).map((ticket) => (
          makeStopLink(ticket.label, ticket.url, "ticket")
        )).join("");
        return `
          <section class="stop">
            <div class="num">${String(index + 1).padStart(2, "0")}</div>
            <div class="stop-body">
              <div class="meta">
                <span>${stop.time}</span>
                <span>${stop.type}</span>
              </div>
              <h3>${stop.name}</h3>
              <p class="desc">${stop.transport}</p>
              <div class="booking">
                <div><strong>门票/预订：</strong>${stop.booking}</div>
                ${ticketLinks ? `<div class="ticket-row"><strong>票务链接：</strong>${ticketLinks}</div>` : ""}
              </div>
              <div class="stop-links">
                ${makeStopLink("Google Maps", googleMapsUrl(stop.place), "primary")}
              </div>
            </div>
          </section>
        `;
      }).join("");

      document.getElementById("dayCard").innerHTML = `
        <header class="day-head">
          <div>
            <h2>${day.date} ${day.title}</h2>
            <div class="route-title">${day.route}</div>
            <div class="route-anchors">
              <a class="anchor-tag" target="_blank" rel="noopener" href="${googleMapsUrl(day.startPoint.place)}">${day.startPoint.label}</a>
              <a class="anchor-tag" target="_blank" rel="noopener" href="${googleMapsUrl(day.endPoint.place)}">${day.endPoint.label}</a>
            </div>
            <div class="quick-links">
              ${makeStopLink("当天完整路线", dayRouteUrl(day), "lake")}
            </div>
          </div>
          <a class="badge stay-link" target="_blank" rel="noopener" href="${googleMapsUrl(day.sleepPlace || day.sleep)}">${day.sleep}</a>
        </header>
        <div class="timeline">${stops}</div>
      `;
    }

    function showMapFallback() {
      const fallback = document.getElementById("mapFallback");
      const fallbackRoute = document.getElementById("fallbackRoute");
      fallbackRoute.href = dayRouteUrl(itinerary[current]);
      fallback.classList.add("show");
    }

    function hideMapFallback() {
      document.getElementById("mapFallback").classList.remove("show");
    }

    function installTileLayer(index = 0) {
      tileLayerIndex = index;
      if (activeTileLayer) activeTileLayer.remove();
      const config = tileLayers[tileLayerIndex];
      activeTileLayer = L.tileLayer(config.url, config.options).addTo(map);
      clearTimeout(tileLoadTimer);
      tileLoadTimer = setTimeout(() => {
        if (tileLayerIndex < tileLayers.length - 1) {
          installTileLayer(tileLayerIndex + 1);
        } else {
          showMapFallback();
        }
      }, 4500);
      activeTileLayer.once("load", () => {
        clearTimeout(tileLoadTimer);
        hideMapFallback();
      });
      activeTileLayer.once("tileerror", () => {
        clearTimeout(tileLoadTimer);
        if (tileLayerIndex < tileLayers.length - 1) {
          installTileLayer(tileLayerIndex + 1);
        } else {
          showMapFallback();
        }
      });
    }

    function renderMap() {
      const day = itinerary[current];
      document.getElementById("fallbackRoute").href = dayRouteUrl(day);
      if (!window.L) {
        showMapFallback();
        return;
      }
      if (!map) {
        map = L.map("map", { zoomControl: true, scrollWheelZoom: false }).setView(day.center, day.zoom);
        installTileLayer(0);
      }

      markers.forEach((marker) => marker.remove());
      markers = [];
      if (routeLine) routeLine.remove();

      const routePoints = [
        { ...day.startPoint, name: day.startPoint.label, type: "起点", time: "Start", isAnchor: true },
        ...day.stops,
        { ...day.endPoint, name: day.endPoint.label, type: "终点", time: "End", isAnchor: true }
      ];
      const coords = routePoints.map((point) => point.coords);
      routeLine = L.polyline(coords, {
        color: "#2f8fa4",
        weight: 4,
        opacity: 0.82,
        dashArray: "8 8"
      }).addTo(map);

      routePoints.forEach((stop, index) => {
        const label = stop.isAnchor ? (index === 0 ? "起" : "终") : String(index).padStart(2, "0");
        const icon = L.divIcon({
          html: `<div class="pin-label ${stop.isAnchor ? "anchor" : ""}">${label}</div>`,
          className: "",
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        const marker = L.marker(stop.coords, { icon }).addTo(map);
        marker.bindPopup(`<div class="popup-title">${stop.name}</div><div class="popup-text">${stop.time} · ${stop.type}</div>`);
        markers.push(marker);
      });

      if (coords.length === 1) {
        map.setView(coords[0], day.zoom);
      } else {
        map.fitBounds(routeLine.getBounds(), { padding: [45, 45], maxZoom: day.zoom });
      }
    }

    function render() {
      renderTabs();
      renderDay();
      renderMap();
    }

    window.refreshItineraryMap = function () {
      if (!window.L) return;
      renderMap();
    };

    document.getElementById("prevDay").addEventListener("click", () => {
      current = (current + itinerary.length - 1) % itinerary.length;
      render();
    });

    document.getElementById("nextDay").addEventListener("click", () => {
      current = (current + 1) % itinerary.length;
      render();
    });

    render();
  </script>
</body>
</html>
